<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; overflow: hidden; display: flex; justify-content: center; font-family: sans-serif; }
  #island {
    width: 120px; height: 35px; background: black; border-radius: 20px; margin-top: 15px;
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    display: flex; align-items: center; padding: 0 10px; color: white; overflow: hidden;
  }
  #island.expanded { width: 320px; height: 65px; border-radius: 35px; }
  
  .island-content { opacity: 0; transition: opacity 0.2s; display: none; width: 100%; align-items: center; justify-content: space-between; }
  .visible { opacity: 1; transition: opacity 0.5s 0.2s; display: flex; }
  
  /* Shared Styles */
  .icon { width: 40px; height: 40px; border-radius: 50%; object-fit: contain; }
  .text-box { display: flex; flex-direction: column; justify-content: center; margin-left: 10px; flex-grow: 1; }
  .title { font-size: 14px; font-weight: bold; }
  .subtitle { font-size: 12px; color: #4ade80; }
  
  /* Music Visualizer */
  .visualizer { display: flex; gap: 3px; align-items: flex-end; height: 20px; }
  .bar { width: 4px; background: #fbbf24; border-radius: 2px; animation: bounce 0.5s infinite alternate; }
  .bar:nth-child(2) { animation-delay: 0.1s; }
  .bar:nth-child(3) { animation-delay: 0.2s; }
  @keyframes bounce { 0% { height: 5px; } 100% { height: 20px; } }
</style>
</head>
<body>

<div id="island">
  <!-- Bluetooth State -->
  <div id="bt-state" class="island-content">
    <img src="boat_airdopes.jpg" class="icon">
    <div class="text-box"><span class="title">boAt Airdopes 800</span><span class="subtitle">Connected</span></div>
  </div>

  <!-- Charging State -->
  <div id="charge-state" class="island-content">
    <div class="icon" style="background:#4ade80; display:flex; justify-content:center; align-items:center; color:black; font-weight:bold;">⚡</div>
    <div class="text-box"><span class="title">Charging</span><span class="subtitle" id="battery-pct">--%</span></div>
  </div>

  <!-- Music State -->
  <div id="music-state" class="island-content">
    <div class="icon" style="background:#fbbf24; display:flex; justify-content:center; align-items:center; color:black;">🎵</div>
    <div class="text-box"><span class="title" id="song-title">Playing...</span></div>
    <div class="visualizer"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
  </div>
</div>

<script>
  const island = document.getElementById('island');
  let currentTimeout;

  function showState(stateId, duration) {
    clearTimeout(currentTimeout);
    document.querySelectorAll('.island-content').forEach(el => {
      el.classList.remove('visible');
    });
    
    island.classList.add('expanded');
    
    setTimeout(() => {
      document.getElementById(stateId).classList.add('visible');
    }, 200);

    if (duration > 0) {
      currentTimeout = setTimeout(() => {
        document.getElementById(stateId).classList.remove('visible');
        island.classList.remove('expanded');
      }, duration);
    }
  }

  function triggerBluetooth() { showState('bt-state', 4000); }
  function triggerCharging(percent) { 
    document.getElementById('battery-pct').innerText = percent + '%';
    showState('charge-state', 4000); 
  }
  function triggerMusic(songName) {
    document.getElementById('song-title').innerText = songName;
    showState('music-state', 0);
  }
</script>
</body>
</html>
